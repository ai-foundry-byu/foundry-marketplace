# Maestro flow template: iOS Simulator sign-in story.
# Run:   maestro test --test-output-dir=.qa/ios/maestro .qa/ios/flows/S1.yaml \
#          -e QA_EMAIL=qa-user@example.test -e QA_PASSWORD=<test-account-password>
# Use a TEST account only. Never put a real user's credentials in a flow file.
#
# appId is the iOS bundle identifier. ids are accessibilityIdentifier values
# (SwiftUI: .accessibilityIdentifier("email")). Find them with: maestro hierarchy
appId: com.example.app
name: "S1 user signs in (ios)"
tags:
  - smoke
  - ios
---
- launchApp:
    clearState: true
    clearKeychain: true       # iOS keeps keychain items across reinstalls; clear them for a clean start
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 15000
- takeScreenshot: S1-01-launch
- tapOn:
    id: "email"
- inputText: ${QA_EMAIL}
- tapOn:
    id: "password"
- inputText: ${QA_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
# iOS system alerts (notifications, tracking) can cover the screen after sign-in.
# This taps "Allow" only if the alert is there.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 20000
- assertNotVisible: "Something went wrong"
- takeScreenshot: S1-02-signed-in
