# Maestro flow template: Android sign-in story.
# Run:   maestro test --test-output-dir=.qa/android/maestro templates/maestro/android-sign-in.yaml \
#          -e QA_EMAIL=qa-user@example.test -e QA_PASSWORD=<test-account-password>
# Use a TEST account only. Never put a real user's credentials in a flow file.
#
# Replace com.example.app and the ids below with your app's values.
# Find ids with: maestro hierarchy   (or adb shell uiautomator dump, then scripts/uitree.py outline)
appId: com.example.app
name: "S1 user signs in (android)"
tags:
  - smoke
  - android
---
- launchApp:
    clearState: true          # start from a fresh install state
    permissions:
      all: deny               # the story should still work with permissions denied
- extendedWaitUntil:
    visible:
      id: "email"             # matches resource-id com.example.app:id/email
    timeout: 15000
- takeScreenshot: S1-01-launch
- tapOn:
    id: "email"
- inputText: ${QA_EMAIL}
- tapOn:
    id: "password"
- inputText: ${QA_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"            # visible text; prefer an id when one exists
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 20000
- assertNotVisible: "Something went wrong"
- takeScreenshot: S1-02-signed-in
# Android-only: hardware back should not log the user out
- back
- assertVisible: "Welcome"
