# .github/workflows/secret-scan.yml
# Scans every push and pull request, including full history on the first run.
# Uses the gitleaks binary directly (the gitleaks GitHub Action needs a license key for org repos).
name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan
        run: gitleaks git --redact --no-banner -v .
