name: Device smoke (foundry-devices)

# Runs the foundry-devices plugin's own scripts and the exact commands its agents and
# skills tell a student to run, on real Android, iOS, Windows and macOS runners.
# Each platform script records PASS/FAIL per instruction in .qa/<platform>/steps.tsv
# and the job summary. Steps tagged "FIXED Dn" assert the fixed behavior for defect Dn,
# running the plugin's corrected commands extracted verbatim from its agent files
# (.github/device-smoke/mdblock.py). A failing step fails its job.

on:
  push:
    branches: [test/device-smoke]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unit tests (plugin's own)
        working-directory: plugins/foundry-devices
        run: python3 -m unittest discover -s tests -v
      - name: Android emulator + android-qa instructions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # the android-qa agent's own emulator flags, plus -no-window and a software GPU for CI
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-audio -no-boot-anim
          disable-animations: false
          script: bash .github/device-smoke/android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-android
          path: .qa/
          include-hidden-files: true
          if-no-files-found: warn

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: iOS Simulator + ios-qa instructions
        run: bash .github/device-smoke/ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-ios
          path: .qa/
          include-hidden-files: true
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}\plugins\foundry-devices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: windows-qa instructions (Git Bash)
        shell: bash
        run: bash .github/device-smoke/windows.sh
      - name: windows-qa instructions (PowerShell)
        if: always()
        shell: pwsh
        run: ./.github/device-smoke/windows-ps.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-windows
          path: .qa/
          include-hidden-files: true
          if-no-files-found: warn

  macos-desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: macos-qa + macos-ax-tree instructions
        run: bash .github/device-smoke/macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-macos
          path: .qa/
          include-hidden-files: true
          if-no-files-found: warn
