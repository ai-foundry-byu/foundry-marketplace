name: CI

# Item rules (CONTRIBUTING.md R1-R4), vendored copies, the catalog, and every plugin's tests.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Item rules and catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Item rules (R1-R3)
        run: python3 scripts/check_items.py

      - name: Vendored copies match their canonical files
        run: python3 scripts/sync_vendor.py --check

      - name: Root script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: site/catalog.json is current
        run: python3 scripts/build_catalog.py --check

  plugin-tests:
    name: Plugin unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The browser tests in foundry-qa and foundry-design skip themselves without
      # Playwright; install it so they run.
      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Every plugin's tests
        run: python3 scripts/run_plugin_tests.py
